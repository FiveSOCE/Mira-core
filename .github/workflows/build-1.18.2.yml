name: MiraCore Paper 1.18.2 Compatibility
on:
  push:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile and test Java 17 Paper 1.18.2
        run: gradle clean test build --stacktrace --no-daemon
      - name: Verify distributable JAR
        run: |
          set -euo pipefail
          JAR=build/libs/MiraCore-0.6.1-1.18.2.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx plugin.yml
          jar tf "$JAR" | grep -Fx com/mira/core/MiraCorePlugin.class
          javap -verbose -classpath "$JAR" com.mira.core.MiraCorePlugin | grep -F 'major version: 61'
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '1.18'"
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCore-1.18.2
          path: build/libs/MiraCore-0.6.1-1.18.2.jar
          if-no-files-found: error
      - name: Publish legacy prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-1.18.2 >/dev/null 2>&1 || gh release create dev-1.18.2 --prerelease --title 'MiraCore for Paper 1.18.2' --notes 'Java 17 / Paper 1.18.2 compatibility edition; same MiraCore source features, API compatibility changes. Verify plugin runtime in a staging server.' --target "$GITHUB_SHA"
          gh release upload dev-1.18.2 build/libs/MiraCore-0.6.1-1.18.2.jar --clobber
