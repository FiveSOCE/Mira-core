name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraCore-${{ steps.version.outputs.version }}
          path: build/libs/MiraCore-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release branch
        if: success() && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraCore-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraCore $TAG" \
              --notes "Adds MiraCore-managed EssentialsX presentation ownership. EssentialsX keeps command execution, permissions and functionality, while MiraCore imports the current Essentials message bundle, centralizes it under plugins/MiraCore, applies Mira styling, deploys the generated locale override back to EssentialsX, and provides /miracore essentials [sync] for administration."
          fi
