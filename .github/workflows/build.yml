name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify Paper 1.21.11 compatibility
        run: gradle clean compileJava -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace

  compatibility-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Verify Paper 26.2 compatibility
        run: gradle clean compileJava -PpaperApiVersion=26.2.build.121-stable -PcompileJavaVersion=25 -PbytecodeJavaVersion=25 --stacktrace

  build:
    needs: [compatibility-1-21-11, compatibility-26-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build baseline-compatible JAR
        run: gradle clean test build -PpaperApiVersion=1.21.11-R0.1-SNAPSHOT -PcompileJavaVersion=21 -PbytecodeJavaVersion=21 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCore-0.6.0
          path: build/libs/MiraCore-0.6.0.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 build/libs/MiraCore-0.6.0.jar --clobber
          else
            gh release create v0.6.0 build/libs/MiraCore-0.6.0.jar --target "${{ github.sha }}" --title "MiraCore v0.6.0" --notes "Moves /fix hand and /fix all into MiraCore with paid repairs, permissions and a 5-hour /fix all cooldown. /fix hand costs $15,000; /fix all costs $5,000 per damaged item. Also replaces the /guides click path with tracked menu instances and direct slot mapping so guide selections no longer depend on Bukkit inventory-holder behavior."
          fi
