name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean test build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCore-0.5.4
          path: build/libs/MiraCore-0.5.4.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.4 >/dev/null 2>&1; then
            gh release upload v0.5.4 build/libs/MiraCore-0.5.4.jar --clobber
          else
            gh release create v0.5.4 build/libs/MiraCore-0.5.4.jar --target "${{ github.sha }}" --title "MiraCore v0.5.4" --notes "Adds global Factions consumable cooldowns: 3 seconds for Ender Pearls and 5 minutes for Enchanted Golden Apples, with configurable bypass."
          fi
