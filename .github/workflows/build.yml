name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean test build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCore-0.5.5
          path: build/libs/MiraCore-0.5.5.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.5 >/dev/null 2>&1; then
            gh release upload v0.5.5 build/libs/MiraCore-0.5.5.jar --clobber
          else
            gh release create v0.5.5 build/libs/MiraCore-0.5.5.jar --target "${{ github.sha }}" --title "MiraCore v0.5.5" --notes "Makes MiraCore the sole join-message owner, formats joins with LuckPerms rank prefix, and grants the configured starting rank access to the starter kit and guides."
          fi
