name: Legacy Paper 1.18.2 validation
on:
  push:
    branches: ['compat/1.18.2']
  pull_request:
    branches: ['compat/1.18.2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile and run tests against Paper 1.18.2
        run: gradle clean test build -PpaperApiVersion=1.18.2-R0.1-SNAPSHOT -PcompileJavaVersion=17 -PbytecodeJavaVersion=17 --stacktrace
      - name: Verify required JAR and plugin descriptor
        run: |
          test -s build/libs/MiraCore_1.18.2.jar
          unzip -p build/libs/MiraCore_1.18.2.jar plugin.yml | grep -F "api-version: '1.18'"
          unzip -p build/libs/MiraCore_1.18.2.jar plugin.yml | grep -F 'main: com.mira.core.MiraCorePlugin'
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCore_1.18.2-build-unverified-runtime
          path: build/libs/MiraCore_1.18.2.jar
          if-no-files-found: error
