# EssentialsX remains the command/functionality backend. MiraCore owns its player-facing message bundle.
integrations:
  essentials:
    enabled: true

    # MiraCore manages this EssentialsX locale and deploys messages_<locale>.properties.
    locale: "en"

    # When enabled, MiraCore keeps EssentialsX on the locale above and disables per-player locale
    # so every player sees the same Mira-controlled command text.
    enforce-locale: true

    # Keeps EssentialsX help, usage, errors and confirmations short and Mira-like.
    simplify:
      enabled: true

    style:
      # Applied to normal EssentialsX feedback messages when MiraCore first imports a message key.
      apply-prefix: false
      prefix: "<dark_purple><bold>Mira</bold> <dark_gray>» <reset>"

      # Only keys explicitly listed here may receive the Mira prefix.
      # Essentials reuses many translation values as arguments inside other messages,
      # so global prefixing can corrupt output such as /gms.
      prefix-keys: []

      # EssentialsX <primary>/<secondary> tags are rewritten into the Mira palette on first import.
      primary: "<gray>"
      secondary: "<light_purple>"

      # These are message-format templates, not standalone feedback lines, so they should not receive a prefix.
      no-prefix-keys:
        - "action"
        - "msgFormat"
        - "mailFormat"
        - "socialSpyMsgFormat"
        - "socialSpyMsgFormatFrom"
        - "socialSpyMsgFormatTo"

# Prefix used by MiraCore chat output.
prefix: "&5&lMira &8>> &r"

# Runs a compact self-check shortly after startup and writes the result to console.
diagnostics:
  startup-check: true

# Shared suite audit history.
audit:
  max-entries: 5000

# MiraCore owns the normal server-list MOTD and maintenance override.
# Remove any old MOTD plugin once this build is installed to avoid competing ping listeners.
motd:
  normal:
    lines:
      - "&5&lMira &8| &fFactions"
      - "&7Welcome to the server"
  maintenance:
    lines:
      - "&5&lMira &8| &cMAINTENANCE"
      - "&7%reason%"
  join:
    enabled: false
    messages:
      - "&5&lMira &8>> &fWelcome to the server."
  max-players:
    modify: false
    value: 200
  icon:
    enabled: false
    file: "server-icon.png"

# Shared maintenance authority. Runtime state/schedules are persisted in maintenance.yml.
maintenance:
  enabled: false
  default-reason: "Server maintenance"
  bypass-permission: "miracore.maintenance.bypass"

  # /miracore maintenance on [reason...] starts this countdown before the gate activates.
  # Use "force" for immediate activation.
  activation-countdown-seconds: 30

  # Warning broadcasts fired while maintenance is counting down.
  countdown-seconds: [1800, 600, 300, 60, 30, 10, 5, 4, 3, 2, 1]

  # Every connected player is kicked when maintenance activates.
  # Bypass permission controls re-entry only.
  kick-message: "&5&lMira &8>> &cThe server is now under maintenance. &7Reason: &f%reason%"

  # Legacy single-line getter kept for API compatibility. Server-list rendering uses motd.maintenance.lines.
  motd: "&5&lMira &8- &cMaintenance"

  messages:
    countdown: "&5&lMira &8>> &eMaintenance begins in &f%time%&e. &7%reason%"
    active: "&5&lMira &8>> &cMaintenance mode is now active. &7%reason%"
    disabled: "&5&lMira &8>> &aMaintenance mode has ended. The server is open again."

# Report-only GitHub release checks. MiraCore never downloads or replaces JARs.
updater:
  enabled: true
  timeout-seconds: 8
  repositories:
    MiraCore: "FiveSOCE/MIra-core"
    MiraFactions: "FiveSOCE/Mira-Factions"
    MiraSpawners: "FiveSOCE/Mira-Spawners"
    MiraShop: "FiveSOCE/Mira-shop"
    MiraCombat: "FiveSOCE/Mira-Combat"
    MiraEnchantments: "FiveSOCE/Mira-Enchants"
    MiraItems: "FiveSOCE/Mira-Items"
    MiraCrates: "FiveSOCE/Mira-Crates"
    MiraTags: "FiveSOCE/Mira-Tags"
    MiraTab: "FiveSOCE/Mira-Tab"
    MiraNPC: "FiveSOCE/Mira-NPC"
    MiraAuctionHouse: "FiveSOCE/Mira-AuctionHouse"
    MiraKits: "FiveSOCE/Mira-Kits"
    MiraFly: "FiveSOCE/Mira-Fly"
    MiraHomes: "FiveSOCE/Mira-Homes"
    MiraWarps: "FiveSOCE/Mira-Warps"
    MiraWithdraw: "FiveSOCE/Mira-Withdraw"
    MiraRedeem: "FiveSOCE/Mira-Redeem"
    MiraPinata: "FiveSOCE/Mira-Pinata"
    MiraBounties: "FiveSOCE/Mira-Bounties"
