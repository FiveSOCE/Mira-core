name: MiraCore
version: ${version}
main: com.mira.core.MiraCorePlugin
api-version: '1.21'
authors: [FiveS]
description: Shared infrastructure and API services for the Mira plugin ecosystem.
softdepend: [Essentials]

commands:
  miracore:
    description: MiraCore suite dashboard, diagnostics and administration.
    usage: /miracore [status|test|why|audit|profiles|maintenance|updates|essentials|reload|help]
    aliases: [mcore]
    permission: miracore.admin
  rewards:
    description: Preview and claim safely queued Mira rewards.
    usage: /rewards
    permission: miracore.rewards
  claim:
    description: Redeem a global Mira claim code into the reward queue.
    usage: /claim <code>
    permission: miracore.rewards
  guides:
    description: Open permanent player-facing server guides.
    usage: /guides
    permission: miracore.guides

permissions:
  miracore.admin:
    description: Access to MiraCore administration, audits and diagnostics.
    default: op
  miracore.maintenance.bypass:
    description: Allows joining while MiraCore maintenance mode is enabled.
    default: op
  miracore.rewards:
    description: Allows viewing queued rewards and using claim codes.
    default: true
  miracore.guides:
    description: Allows opening the permanent guides menu.
    default: true
